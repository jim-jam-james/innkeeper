version: 1
types:
  Character:
    folder: Characters
    fields:
      optional: [aliases, status, role, summary, species, class, alignment]
    relationships:
      member_of: {target: Faction, cardinality: many, inverse: members}
      leader_of: {target: Faction, cardinality: many, inverse: led_by}
      connected_to: {target: Character, cardinality: many, inverse: connections}
      located_in: {target: Location, cardinality: one, inverse: occupants}
      participant_in: {target: Event, cardinality: many, inverse: participants}
  Faction:
    folder: Factions
    fields:
      optional: [aliases, status, summary, alignment, goals]
    relationships:
      part_of: {target: Faction, cardinality: one, inverse: subfactions}
      allied_with: {target: Faction, cardinality: many, inverse: allies}
      rival_of: {target: Faction, cardinality: many, inverse: rivals}
      located_in: {target: Location, cardinality: many, inverse: factions}
      participant_in: {target: Event, cardinality: many, inverse: faction_participants}
  Location:
    folder: Locations
    hierarchical: true
    fields:
      optional: [summary, biome, population, governance]
    relationships:
      located_in: {target: Location, cardinality: one, inverse: contains}
  Event:
    folder: Events
    hierarchical: true
    fields:
      optional: [date, valid_from, valid_to, summary]
    relationships:
      located_in: {target: Location, cardinality: many, inverse: events}
      part_of: {target: Event, cardinality: one, inverse: sub_events}
      follows: {target: Event, cardinality: one, inverse: followed_by}
  Item:
    folder: Items
    fields:
      optional: [summary, item_type, rarity]
    relationships:
      equipped_by: {target: Character, cardinality: one, inverse: items}
      located_in: {target: Location, cardinality: one, inverse: items}
      associated_with: {target: Event, cardinality: many, inverse: items}
  Lore:
    folder: Lore
    fields:
      optional: [summary, lore_type]
    relationships:
      concerns: {target: Event, cardinality: many, inverse: lore}
  Session:
    folder: Sessions
    hierarchical: true
    fields:
      optional: [session_number, played_on, summary, recap, xp_awarded]
    relationships:
      follows: {target: Session, cardinality: one, inverse: followed_by}
      covers: {target: Event, cardinality: many, inverse: sessions}
      mentions: {target: Character, cardinality: many, inverse: mentioned}
      located_in: {target: Location, cardinality: many, inverse: sessions}
      rewards: {target: Item, cardinality: many, inverse: awarded_in} 